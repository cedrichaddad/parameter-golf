[package]
name = "pg-local"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "pg-local"
path = "src/main.rs"

[dependencies]
pg-core = { path = "../pg-core" }
pg-data = { path = "../pg-data" }
pg-eval = { path = "../pg-eval" }
pg-kernels = { path = "../pg-kernels" }
pg-model = { path = "../pg-model" }
pg-optim = { path = "../pg-optim" }
pg-quant = { path = "../pg-quant" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
crc32fast = { workspace = true }
glob = "0.3"
half = { workspace = true }
zstd = { workspace = true }
metal = { version = "=0.29.0", optional = true }

[features]
default = []
metal_apple = ["dep:metal"]
